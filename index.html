<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Spatial Hand Tracking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0e1a; overflow: hidden; height: 100vh; width: 100vw; }
        #videoElement { transform: scaleX(-1); }
        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #permissionOverlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(10,14,26,0.95);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            font-family: 'Courier New', monospace; color: #38bdf8;
        }
        #permissionOverlay button {
            margin-top: 24px; padding: 14px 40px;
            background: #06b6d4; color: #0a0e1a;
            border: none; font-size: 16px; font-weight: bold;
            cursor: pointer; letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        #permissionOverlay button:hover { background: #22d3ee; }
        #errorMsg { color: #f87171; margin-top: 16px; font-size: 13px; display: none; }
    </style>
</head>
<body>
    <!-- Permission overlay — user MUST click a button to trigger the camera permission popup -->
    <div id="permissionOverlay">
        <div style="font-size: 28px; letter-spacing: 4px; margin-bottom: 8px;">HAND_TRACK_3D</div>
        <div style="font-size: 13px; color: #94a3b8; margin-bottom: 4px;">Real-time 3D spatial gesture interface</div>
        <div style="font-size: 11px; color: #64748b;">Webcam access is required</div>
        <button id="startBtn">START CAMERA</button>
        <div id="errorMsg"></div>
    </div>

    <!-- Main UI -->
    <div id="mainUI" style="display:none;" class="relative w-full h-full flex items-center justify-center">
        <div class="relative w-full h-full bg-black overflow-hidden">
            <video id="videoElement" class="layer object-cover" autoplay playsinline muted></video>
            <canvas id="threeCanvas" class="layer" style="z-index:10; pointer-events:none;"></canvas>
            <canvas id="hudCanvas" class="layer" style="z-index:20; pointer-events:none;"></canvas>
        </div>
    </div>

    <script>
    /* ===== CONFIGURATION ===== */
    const CFG = {
        MAX_HANDS: 2,
        DETECTION_CONFIDENCE: 0.65,
        TRACKING_CONFIDENCE: 0.65,
        SMOOTHING: 0.35,
        LOCK_COOLDOWN_MS: 1200,
        COLORS: {
            IDLE: 0x94a3b8,
            MANIPULATING: 0x06b6d4,
            CREATING: 0x10b981,
            LOCKED: 0xf59e0b
        }
    };

    /* ===== LANDMARK SMOOTHER ===== */
    const smoothed = new Map();
    function smoothLandmarks(multiHands) {
        if (!multiHands || multiHands.length === 0) { smoothed.clear(); return []; }
        const out = [];
        multiHands.forEach(function(hand, idx) {
            if (!smoothed.has(idx)) {
                smoothed.set(idx, hand.map(function(l) { return {x:l.x,y:l.y,z:l.z}; }));
            } else {
                var prev = smoothed.get(idx);
                var next = hand.map(function(l, i) {
                    return {
                        x: prev[i].x + CFG.SMOOTHING * (l.x - prev[i].x),
                        y: prev[i].y + CFG.SMOOTHING * (l.y - prev[i].y),
                        z: prev[i].z + CFG.SMOOTHING * (l.z - prev[i].z)
                    };
                });
                smoothed.set(idx, next);
            }
            out.push(smoothed.get(idx));
        });
        return out;
    }

    /* ===== FINGER EXTENSION CHECK ===== */
    function isExtended(hand, tipIdx, pipIdx) {
        var dTip = Math.hypot(hand[tipIdx].x - hand[0].x, hand[tipIdx].y - hand[0].y);
        var dPip = Math.hypot(hand[pipIdx].x - hand[0].x, hand[pipIdx].y - hand[0].y);
        return dTip > dPip;
    }

    /* ===== STATE ===== */
    var gestureState = 'IDLE';
    var lockCooldownUntil = 0;
    var lockedMeshes = [];
    var latestHands = [];

    /* ===== THREE.JS SETUP ===== */
    var threeCanvas = document.getElementById('threeCanvas');
    var renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    var scene = new THREE.Scene();
    var camera3d = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera3d.position.z = 2;
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    var dl = new THREE.DirectionalLight(0xffffff, 0.7);
    dl.position.set(1, 1, 1);
    scene.add(dl);

    /* Connection lines between corresponding fingers */
    var lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });
    var lineGeometries = [];
    var lineObjects = [];
    for (var li = 0; li < 4; li++) {
        var lg = new THREE.BufferGeometry();
        lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(6), 3));
        var lo = new THREE.Line(lg, lineMaterial);
        lo.visible = false;
        scene.add(lo);
        lineGeometries.push(lg);
        lineObjects.push(lo);
    }

    /* Active shape mesh */
    var activeGeo = new THREE.BufferGeometry();
    var activeMat = new THREE.MeshPhongMaterial({
        color: CFG.COLORS.MANIPULATING, transparent: true, opacity: 0.5, side: THREE.DoubleSide
    });
    var activeMesh = new THREE.Mesh(activeGeo, activeMat);
    activeMesh.visible = false;
    scene.add(activeMesh);

    /* Wireframe for active shape */
    var wireframeMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.7 });
    var activeWire = null;

    function mapCoord(lm) {
        return new THREE.Vector3((lm.x - 0.5) * 2 * -1, -(lm.y - 0.5) * 2, -lm.z * 2);
    }

    function resizeRenderer() {
        var w = window.innerWidth, h = window.innerHeight;
        renderer.setSize(w, h);
        renderer.setPixelRatio(window.devicePixelRatio);
        camera3d.aspect = w / h;
        camera3d.updateProjectionMatrix();
    }
    window.addEventListener('resize', resizeRenderer);

    /* ===== LOCK via Spacebar ===== */
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault();
            if (Date.now() < lockCooldownUntil) return;
            if (!activeMesh.visible) return;
            lockCurrentShape();
        }
    });

    function lockCurrentShape() {
        if (!activeMesh.visible || !activeGeo.attributes.position || activeGeo.attributes.position.count === 0) return;
        var cloneGeo = activeGeo.clone();
        var cloneMat = new THREE.MeshPhongMaterial({
            color: CFG.COLORS.LOCKED, transparent: true, opacity: 0.85, side: THREE.DoubleSide
        });
        var clone = new THREE.Mesh(cloneGeo, cloneMat);
        var wf = new THREE.LineSegments(new THREE.WireframeGeometry(cloneGeo),
            new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25 }));
        clone.add(wf);
        scene.add(clone);
        lockedMeshes.push(clone);
        lockCooldownUntil = Date.now() + CFG.LOCK_COOLDOWN_MS;
        gestureState = 'LOCKED';
        setTimeout(function() { gestureState = 'IDLE'; }, CFG.LOCK_COOLDOWN_MS);
    }

    /* ===== HUD CANVAS ===== */
    var hudCanvas = document.getElementById('hudCanvas');
    var hud = hudCanvas.getContext('2d');
    var fpsCounter = 0, fps = 0, lastFpsTime = performance.now();

    function resizeHud() {
        hudCanvas.width = window.innerWidth;
        hudCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeHud);

    function drawHud(numHands, pairs) {
        fpsCounter++;
        var now = performance.now();
        if (now - lastFpsTime >= 1000) {
            fps = fpsCounter;
            fpsCounter = 0;
            lastFpsTime = now;
        }

        hud.clearRect(0, 0, hudCanvas.width, hudCanvas.height);

        /* Top-left panel */
        hud.fillStyle = 'rgba(10,14,26,0.85)';
        hud.fillRect(16, 16, 240, 140);
        hud.strokeStyle = 'rgba(6,182,212,0.4)';
        hud.lineWidth = 1;
        hud.strokeRect(16, 16, 240, 140);

        hud.font = '11px "Courier New", monospace';
        hud.fillStyle = '#38bdf8';
        hud.fillText('HAND_TRACK_3D', 30, 38);

        hud.fillStyle = '#94a3b8';
        hud.fillText('FPS: ' + fps, 30, 58);
        hud.fillText('HANDS: ' + numHands, 30, 74);
        hud.fillText('ACTIVE PAIRS: ' + pairs, 30, 90);
        hud.fillText('LOCKED OBJS: ' + lockedMeshes.length, 30, 106);

        var sc = '#94a3b8';
        if (gestureState === 'MANIPULATING') sc = '#06b6d4';
        if (gestureState === 'LOCKED') sc = '#f59e0b';
        hud.fillStyle = sc;
        hud.fillText('STATE: ' + gestureState, 30, 126);

        hud.fillStyle = '#64748b';
        hud.fillText('[SPACE] Lock shape', 30, 146);

        /* XYZ Gizmo */
        var gx = hudCanvas.width - 60, gy = hudCanvas.height - 60;
        hud.lineWidth = 2;
        hud.strokeStyle = '#ef4444';
        hud.beginPath(); hud.moveTo(gx, gy); hud.lineTo(gx + 30, gy); hud.stroke();
        hud.fillStyle = '#ef4444'; hud.font = '10px monospace'; hud.fillText('X', gx + 33, gy + 4);
        hud.strokeStyle = '#22c55e';
        hud.beginPath(); hud.moveTo(gx, gy); hud.lineTo(gx, gy - 30); hud.stroke();
        hud.fillStyle = '#22c55e'; hud.fillText('Y', gx - 4, gy - 34);
        hud.strokeStyle = '#3b82f6';
        hud.beginPath(); hud.moveTo(gx, gy); hud.lineTo(gx - 20, gy + 20); hud.stroke();
        hud.fillStyle = '#3b82f6'; hud.fillText('Z', gx - 30, gy + 28);
    }

    /* ===== UPDATE 3D SCENE ===== */
    function updateScene(hands) {
        /* Hide all lines by default */
        lineObjects.forEach(function(lo) { lo.visible = false; });
        activeMesh.visible = false;

        if (hands.length < 2) {
            if (gestureState !== 'LOCKED') gestureState = hands.length > 0 ? 'MANIPULATING' : 'IDLE';
            return 0;
        }

        var h1 = hands[0], h2 = hands[1];

        /* Finger pairs: [tipIndex, pipIndex] for extension check */
        var fingerDefs = [
            { tip: 4,  pip: 3,  name: 'Thumb' },   /* Thumb tip vs IP */
            { tip: 8,  pip: 6,  name: 'Index' },    /* Index tip vs PIP */
            { tip: 12, pip: 10, name: 'Middle' },   /* Middle tip vs PIP */
            { tip: 16, pip: 14, name: 'Ring' }      /* Ring tip vs PIP */
        ];

        var activePairs = [];

        fingerDefs.forEach(function(fd, i) {
            var ext1 = isExtended(h1, fd.tip, fd.pip);
            var ext2 = isExtended(h2, fd.tip, fd.pip);
            if (ext1 && ext2) {
                var p1 = mapCoord(h1[fd.tip]);
                var p2 = mapCoord(h2[fd.tip]);
                activePairs.push({ p1: p1, p2: p2 });

                /* Draw connection line */
                var posArr = lineGeometries[i].attributes.position.array;
                posArr[0] = p1.x; posArr[1] = p1.y; posArr[2] = p1.z;
                posArr[3] = p2.x; posArr[4] = p2.y; posArr[5] = p2.z;
                lineGeometries[i].attributes.position.needsUpdate = true;
                lineObjects[i].visible = true;
            }
        });

        var pairCount = activePairs.length;

        if (pairCount >= 2) {
            /* Build solid geometry connecting the pairs */
            var verts = [];
            var indices = [];

            /* All H1 points first, then all H2 points */
            activePairs.forEach(function(p) { verts.push(p.p1.x, p.p1.y, p.p1.z); });
            activePairs.forEach(function(p) { verts.push(p.p2.x, p.p2.y, p.p2.z); });

            if (pairCount === 2) {
                /* 2D Quad: 0,1 (H1), 2,3 (H2) */
                indices.push(0,1,2, 1,3,2);
            } else if (pairCount === 3) {
                /* Triangular Prism: 0,1,2 (H1), 3,4,5 (H2) */
                indices.push(
                    0,1,2,       /* Base 1 */
                    3,5,4,       /* Base 2 */
                    0,3,4, 0,4,1,
                    1,4,5, 1,5,2,
                    2,5,3, 2,3,0
                );
            } else if (pairCount === 4) {
                /* Hexahedron: 0,1,2,3 (H1), 4,5,6,7 (H2) */
                indices.push(
                    0,1,2, 0,2,3,
                    4,6,5, 4,7,6,
                    0,4,5, 0,5,1,
                    1,5,6, 1,6,2,
                    2,6,7, 2,7,3,
                    3,7,4, 3,4,0
                );
            }

            activeGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(verts), 3));
            activeGeo.setIndex(indices);
            activeGeo.computeVertexNormals();
            activeMesh.visible = true;

            /* Update wireframe */
            if (activeWire) activeMesh.remove(activeWire);
            activeWire = new THREE.LineSegments(new THREE.WireframeGeometry(activeGeo), wireframeMat);
            activeMesh.add(activeWire);

            activeMat.color.setHex(
                gestureState === 'LOCKED' ? CFG.COLORS.LOCKED : CFG.COLORS.MANIPULATING
            );
        }

        if (gestureState !== 'LOCKED') gestureState = 'MANIPULATING';
        return pairCount;
    }

    /* ===== MAIN RENDER LOOP ===== */
    function renderLoop() {
        var hands = smoothLandmarks(latestHands);
        var pairs = updateScene(hands);
        renderer.render(scene, camera3d);
        drawHud(hands.length, pairs);
        requestAnimationFrame(renderLoop);
    }

    /* ===== MEDIAPIPE CALLBACK ===== */
    function onResults(results) {
        latestHands = results.multiHandLandmarks || [];
    }

    /* ===== START CAMERA (triggered by button click) ===== */
    document.getElementById('startBtn').addEventListener('click', function() {
        var errorEl = document.getElementById('errorMsg');
        errorEl.style.display = 'none';

        navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } })
        .then(function(stream) {
            var video = document.getElementById('videoElement');
            video.srcObject = stream;
            video.play();

            /* Hide overlay, show main UI */
            document.getElementById('permissionOverlay').style.display = 'none';
            document.getElementById('mainUI').style.display = 'flex';

            /* Resize everything */
            resizeRenderer();
            resizeHud();

            /* Init MediaPipe Hands */
            var hands = new Hands({ locateFile: function(file) {
                return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file;
            }});
            hands.setOptions({
                maxNumHands: CFG.MAX_HANDS,
                modelComplexity: 1,
                minDetectionConfidence: CFG.DETECTION_CONFIDENCE,
                minTrackingConfidence: CFG.TRACKING_CONFIDENCE
            });
            hands.onResults(onResults);

            /* Start camera loop */
            var cam = new Camera(video, {
                onFrame: function() { return hands.send({ image: video }); },
                width: 1280,
                height: 720
            });
            cam.start();

            /* Start render loop */
            requestAnimationFrame(renderLoop);
        })
        .catch(function(err) {
            errorEl.textContent = 'Camera error: ' + err.message;
            errorEl.style.display = 'block';
        });
    });
    </script>
</body>
</html>
